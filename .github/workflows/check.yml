name: Check

# This workflow only runs read-only checks against the HTML -- it never
# builds or deploys anything, and has no effect on GitHub Pages (which
# deploys from a branch, configured separately under Settings > Pages).
on:
  push:
  pull_request:

# Read-only: the check never needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Run HTML/link checks
        run: python3 scripts/check.py
